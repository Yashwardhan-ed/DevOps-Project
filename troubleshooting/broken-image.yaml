apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-broken-image
  namespace: helpdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk-broken-image
  template:
    metadata:
      labels:
        app: helpdesk-broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/yashwardhan-ed/devops-project-backend:tag-that-does-not-exist
