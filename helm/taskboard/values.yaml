frontend:
  image: ghcr.io/yashwardhan-ed/devops-project-frontend
  tag: latest

backend:
  image: ghcr.io/yashwardhan-ed/devops-project-backend
  tag: latest

replicaCount: 2
namespace: helpdesk
imagePullSecrets: []

postgres:
  host: helpdesk-postgres
  database: helpdesk
  username: helpdesk
  password: helpdesk

ingress:
  enabled: false
  host: helpdesk.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

monitoring:
  serviceMonitor:
    enabled: true
