apiVersion: v1
kind: Service
metadata:
  name: helpdesk-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: helpdesk-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: helpdesk-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
