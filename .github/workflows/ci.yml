name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/yashwardhan-ed/devops-project-backend
  IMAGE_FRONTEND: ghcr.io/yashwardhan-ed/devops-project-frontend

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — TEST
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — BUILD + TRIVY SCAN + PUSH TO GHCR
  # ──────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} \
            -t ${{ env.IMAGE_BACKEND }}:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} \
            -t ${{ env.IMAGE_FRONTEND }}:latest \
            ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push backend image to GHCR
        run: |
          docker push ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_BACKEND }}:latest

      - name: Push frontend image to GHCR
        run: |
          docker push ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_FRONTEND }}:latest

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — DEPLOY TO KUBERNETES VIA HELM
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Check EKS Cluster Availability
        id: check-cluster
        run: |
          if aws eks describe-cluster --name helpdesk-eks --region ap-south-1 >/dev/null 2>&1; then
            echo "cluster_exists=true" >> "$GITHUB_OUTPUT"
            echo "EKS cluster helpdesk-eks is available. Proceeding with Helm deploy."
          else
            echo "cluster_exists=false" >> "$GITHUB_OUTPUT"
            echo "EKS cluster helpdesk-eks not provisioned yet on AWS. Skipping Helm deployment until terraform apply is executed."
          fi

      - name: Update kubeconfig for EKS
        if: steps.check-cluster.outputs.cluster_exists == 'true'
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name helpdesk-eks

      - name: Install Helm
        if: steps.check-cluster.outputs.cluster_exists == 'true'
        uses: azure/setup-helm@v4

      - name: Deploy via Helm
        if: steps.check-cluster.outputs.cluster_exists == 'true'
        run: |
          helm upgrade --install helpdesk ./helm/taskboard \
            --namespace helpdesk \
            --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=${{ env.IMAGE_BACKEND }} \
            --set frontend.image=${{ env.IMAGE_FRONTEND }} \
            --wait \
            --timeout 5m
